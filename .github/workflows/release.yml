name: Build Release Package

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Prepare release manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("module.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          repository = os.environ["REPOSITORY"]

          data["version"] = version
          data["url"] = f"https://github.com/{repository}"
          data["manifest"] = f"https://github.com/{repository}/releases/latest/download/module.json"
          data["download"] = f"https://github.com/{repository}/releases/download/{tag}/pf1e_compendium_chn.zip"
          data["changelog"] = f"https://github.com/{repository}/releases/tag/{tag}"

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=4) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate JSON files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("module.json"),
              Path("cn.json"),
              Path("tags.json"),
              *sorted(Path("translations").glob("*.json")),
          ]

          for path in files:
              json.loads(path.read_text(encoding="utf-8"))

          print(f"Validated {len(files)} JSON files.")
          PY

      - name: Create module archive
        run: |
          zip -r pf1e_compendium_chn.zip \
            module.json \
            README.md \
            cn.json \
            tags.json \
            scripts \
            styles \
            translations \
            -x "*.DS_Store"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            module.json \
            pf1e_compendium_chn.zip \
            --clobber
